<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playmade · Support Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F24A00;
    --orange-light: rgba(242,74,0,.08);
    --burgundy: #380717;
    --burgundy-light: rgba(56,7,23,.06);
    --salmon: #FFD8C9;
    --salmon-light: #FFF0EA;
    --yellow: #FFE31E;
    --yellow-light: rgba(255,227,30,.12);
    --pale-blue: #E8F1FC;
    --white: #FFFFFF;
    --bg: #FAFBFD;
    --surface: #FFFFFF;
    --border: #E8ECF2;
    --border2: #D5DCE6;
    --text: #380717;
    --text2: #5A2D3A;
    --muted: #8C7080;
    --muted2: #6E4D5E;
    --green: #1A8A54;
    --green-bg: rgba(26,138,84,.08);
    --red: #D93025;
    --red-bg: rgba(217,48,37,.06);
    --r: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 32px 48px;
  }

  /* ── TOPBAR ─────────────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-img {
    height: 36px;
    width: auto;
  }

  .logo-divider {
    width: 1px;
    height: 28px;
    background: var(--border2);
    margin: 0 4px;
  }

  .logo-name {
    font-size: 16px; font-weight: 600;
    color: var(--burgundy);
    letter-spacing: -0.3px;
  }

  .logo-sub {
    font-size: 11px; color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 1px;
  }

  .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* ── DAY TABS ───────────────────────────────────── */
  .day-tabs { display: flex; gap: 4px; flex-wrap: wrap; }

  .day-tab {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all .15s ease;
    white-space: nowrap;
  }

  .day-tab:hover {
    border-color: var(--border2);
    color: var(--text2);
  }

  .day-tab.active {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
    font-weight: 500;
  }

  input[type=date] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted2);
    padding: 7px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    outline: none;
    transition: border-color .15s;
  }

  input[type=date]:focus { border-color: var(--orange); }

  .refresh-btn {
    background: var(--orange);
    border: none;
    color: #fff;
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    font-family: 'Outfit', sans-serif;
    cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    transition: opacity .15s, transform .1s;
    white-space: nowrap;
  }

  .refresh-btn:hover { opacity: .88; }
  .refresh-btn:active { transform: scale(.97); }
  .refresh-btn:disabled { opacity: .4; cursor: not-allowed; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { display: inline-block; animation: spin .6s linear infinite; }

  /* ── SKELETON ───────────────────────────────────── */
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }

  .skel {
    background: linear-gradient(90deg, #eef1f6 25%, #e2e7ef 37%, #eef1f6 63%);
    background-size: 800px 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border-radius: 6px;
  }

  .skel-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 8px;
  }

  .skel-kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 22px;
  }

  .skel-label { width: 80px; height: 8px; margin-bottom: 16px; }
  .skel-value { width: 48px; height: 30px; margin-bottom: 10px; }
  .skel-sub { width: 60px; height: 8px; }
  .skel-section-label { width: 130px; height: 10px; margin: 28px 0 14px; }

  .skel-card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .skel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 24px;
  }

  .skel-card-title { width: 140px; height: 12px; margin-bottom: 8px; }
  .skel-card-sub { width: 110px; height: 8px; margin-bottom: 20px; }
  .skel-bar { height: 6px; margin-bottom: 18px; border-radius: 3px; }
  .skel-chart { height: 148px; border-radius: 8px; }
  .skel-trend { height: 200px; border-radius: 8px; }

  /* ── ERROR ───────────────────────────────────────── */
  #errorBanner {
    display: none;
    background: var(--red-bg);
    border: 1px solid rgba(217,48,37,.15);
    border-radius: var(--r);
    padding: 18px 22px;
    margin-bottom: 24px;
  }

  #errorBanner.show { display: flex; align-items: flex-start; gap: 14px; }

  .err-icon {
    width: 36px; height: 36px;
    background: rgba(217,48,37,.1);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    color: var(--red);
    flex-shrink: 0;
  }

  .err-title {
    font-size: 14px; font-weight: 600;
    color: var(--red);
    margin-bottom: 3px;
  }

  .err-msg {
    font-size: 12px;
    color: #7a3a35;
    font-family: 'DM Mono', monospace;
    word-break: break-word;
    line-height: 1.5;
  }

  .err-retry {
    margin-top: 10px;
    background: var(--surface);
    border: 1px solid rgba(217,48,37,.2);
    color: var(--red);
    font-size: 12px;
    font-weight: 600;
    font-family: 'Outfit', sans-serif;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .15s;
  }

  .err-retry:hover { background: var(--red-bg); }

  /* ── EMPTY STATE ────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 56px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    margin: 16px 0;
  }

  .empty-state-icon {
    width: 56px; height: 56px;
    background: var(--salmon-light);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    margin: 0 auto 18px;
  }

  .empty-state-title {
    font-size: 16px; font-weight: 600;
    color: var(--burgundy);
    margin-bottom: 8px;
  }

  .empty-state-desc {
    font-size: 13px;
    color: var(--muted);
    max-width: 360px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ── SECTIONS ───────────────────────────────────── */
  .slabel {
    font-size: 11px; font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .1em;
    font-family: 'DM Mono', monospace;
    margin: 28px 0 12px;
  }

  /* ── FADE ───────────────────────────────────────── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in { animation: fadeUp .35s ease both; }
  .fade-d1 { animation-delay: .03s; }
  .fade-d2 { animation-delay: .06s; }
  .fade-d3 { animation-delay: .09s; }
  .fade-d4 { animation-delay: .12s; }
  .fade-d5 { animation-delay: .15s; }
  .fade-d6 { animation-delay: .18s; }
  .fade-d7 { animation-delay: .21s; }

  /* ── KPI ─────────────────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
    transition: box-shadow .2s;
  }

  .kpi:hover { box-shadow: 0 2px 12px rgba(56,7,23,.06); }

  .kpi::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
  }

  .kpi.c-orange::before { background: var(--orange); }
  .kpi.c-burgundy::before { background: var(--burgundy); }
  .kpi.c-green::before { background: var(--green); }
  .kpi.c-yellow::before { background: var(--yellow); }

  .kpi-lbl {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    font-family: 'DM Mono', monospace;
    margin-bottom: 12px;
  }

  .kpi-val {
    font-size: 34px; font-weight: 700;
    line-height: 1;
    letter-spacing: -1.5px;
    margin-bottom: 6px;
    color: var(--burgundy);
  }

  .kpi.c-orange .kpi-val { color: var(--orange); }
  .kpi.c-green .kpi-val { color: var(--green); }

  .kpi-sub {
    font-size: 11px; color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* ── CARDS ───────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 22px 24px;
    transition: box-shadow .2s;
  }

  .card:hover { box-shadow: 0 2px 12px rgba(56,7,23,.05); }

  .card-title {
    font-size: 14px; font-weight: 600;
    color: var(--burgundy);
    margin-bottom: 4px;
  }

  .card-sub {
    font-size: 11px; color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-bottom: 18px;
  }

  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

  /* ── BARS ────────────────────────────────────────── */
  .blist { list-style: none; }

  .brow {
    display: flex; align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }

  .brow:last-child { border-bottom: none; }

  .blbl {
    font-size: 12px; color: var(--text2);
    min-width: 150px;
    line-height: 1.3;
  }

  .btrack {
    flex: 1;
    margin: 0 14px;
    background: #f0f2f5;
    border-radius: 4px;
    height: 7px;
    overflow: hidden;
  }

  .bfill {
    height: 100%;
    border-radius: 4px;
    transition: width .5s cubic-bezier(.22,1,.36,1);
  }

  .bval {
    font-size: 13px; font-weight: 600;
    color: var(--burgundy);
    min-width: 28px;
    text-align: right;
    font-family: 'DM Mono', monospace;
  }

  /* ── STARS ───────────────────────────────────────── */
  .srow {
    display: flex; align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }

  .srow:last-child { border-bottom: none; }

  .slbl2 {
    font-size: 12px; color: var(--text2);
    min-width: 34px;
    font-family: 'DM Mono', monospace;
  }

  .strack {
    flex: 1;
    background: #f0f2f5;
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
    margin: 0 12px;
  }

  .sfill {
    height: 100%;
    border-radius: 4px;
    transition: width .5s cubic-bezier(.22,1,.36,1);
  }

  .snum {
    font-size: 13px; font-weight: 600;
    color: var(--burgundy);
    min-width: 28px;
    text-align: right;
    font-family: 'DM Mono', monospace;
  }

  /* ── QUOTES ─────────────────────────────────────── */
  .qrow {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .qrow:last-child { border-bottom: none; }

  .qtext {
    font-size: 13px;
    color: var(--text2);
    font-style: italic;
    line-height: 1.6;
    padding-left: 14px;
    border-left: 3px solid var(--salmon);
  }

  .qmeta {
    font-size: 10px; color: var(--muted);
    margin-top: 6px;
    padding-left: 14px;
    font-family: 'DM Mono', monospace;
  }

  /* ── INSIGHT ─────────────────────────────────────── */
  .insight {
    background: var(--yellow-light);
    border: 1px solid rgba(255,227,30,.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: #7a6500;
    line-height: 1.5;
    margin-top: 14px;
    font-family: 'DM Mono', monospace;
  }

  /* ── EMPTY ───────────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 32px 20px;
    color: var(--muted);
    font-size: 13px;
  }

  /* ── CHART LEGEND ────────────────────────────────── */
  .chart-legend {
    display: flex; gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .chart-legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .chart-legend-dot {
    width: 10px; height: 10px;
    border-radius: 3px;
  }

  /* ── FOOTER ──────────────────────────────────────── */
  .footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
  }

  /* ── RESPONSIVE ──────────────────────────────────── */
  @media (max-width: 1000px) {
    .kpi-grid, .skel-kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .g3, .skel-card-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 640px) {
    .shell { padding: 16px 14px 32px; }
    .g2 { grid-template-columns: 1fr; }
    .kpi-grid, .skel-kpi-grid { grid-template-columns: 1fr 1fr; }
    .kpi-val { font-size: 26px; }
    .day-tabs { gap: 3px; }
    .day-tab { padding: 5px 9px; font-size: 10px; }
    .topbar { gap: 12px; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="logo">
      <img src="/logo.png" alt="Playmade" class="logo-img" />
      <div class="logo-divider"></div>
      <div>
        <div class="logo-name">Support Dashboard</div>
        <div class="logo-sub">Intercom &middot; Daily review</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="day-tabs" id="dayTabs"></div>
      <input type="date" id="customDate" title="Pick a custom date" />
      <button class="refresh-btn" id="refreshBtn" onclick="loadData(true)">
        <span id="rIcon">&#x21bb;</span> Refresh
      </button>
    </div>
  </div>

  <div id="errorBanner">
    <div class="err-icon">!</div>
    <div>
      <div class="err-title">Something went wrong</div>
      <div class="err-msg" id="errMsg"></div>
      <button class="err-retry" onclick="loadData()">Try again</button>
    </div>
  </div>

  <div id="dash"></div>

  <div class="footer">Playmade &middot; Support Dashboard &middot; Data from Intercom</div>
</div>

<script>
let selectedDate = (() => {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
})();
let charts = {};
let isLoading = false;

/* ── Tabs ───────────────────────────────────────── */
function buildTabs() {
  const c = document.getElementById('dayTabs');
  c.innerHTML = '';
  for (let i = 7; i >= 1; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = d.toISOString().split('T')[0];
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (ds === selectedDate ? ' active' : '');
    btn.textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    btn.onclick = () => { selectedDate = ds; document.getElementById('customDate').value = ds; buildTabs(); loadData(); };
    c.appendChild(btn);
  }
  document.getElementById('customDate').value = selectedDate;
}

document.getElementById('customDate').addEventListener('change', e => {
  selectedDate = e.target.value; buildTabs(); loadData();
});

buildTabs();

/* ── Skeleton ───────────────────────────────────── */
function showSkeleton() {
  document.getElementById('dash').innerHTML = `
    <div class="slabel"><div class="skel" style="width:100px;height:10px;"></div></div>
    <div class="skel-kpi-grid">
      ${[0,1,2,3].map(() => `
        <div class="skel-kpi">
          <div class="skel skel-label"></div>
          <div class="skel skel-value"></div>
          <div class="skel skel-sub"></div>
        </div>
      `).join('')}
    </div>
    <div class="skel skel-section-label"></div>
    <div class="skel-card-grid">
      <div class="skel-card">
        <div class="skel skel-card-title"></div>
        <div class="skel skel-card-sub"></div>
        <div class="skel skel-bar" style="width:85%"></div>
        <div class="skel skel-bar" style="width:60%"></div>
        <div class="skel skel-bar" style="width:40%"></div>
      </div>
      <div class="skel-card">
        <div class="skel skel-card-title"></div>
        <div class="skel skel-card-sub"></div>
        <div class="skel skel-bar" style="width:90%"></div>
        <div class="skel skel-bar" style="width:70%"></div>
        <div class="skel skel-bar" style="width:45%"></div>
        <div class="skel skel-bar" style="width:30%"></div>
        <div class="skel skel-bar" style="width:15%"></div>
      </div>
      <div class="skel-card">
        <div class="skel skel-card-title"></div>
        <div class="skel skel-card-sub"></div>
        <div class="skel skel-chart"></div>
      </div>
    </div>
    <div class="skel skel-section-label"></div>
    <div class="skel-card">
      <div class="skel skel-card-title" style="margin-bottom:12px;"></div>
      <div class="skel skel-trend"></div>
    </div>
  `;
}

/* ── Cache ───────────────────────────────────────── */
const CACHE_KEY = 'pm_dash_';
const CACHE_TTL = 24 * 60 * 60 * 1000; // 24h in ms

function getCached(date) {
  try {
    const raw = localStorage.getItem(CACHE_KEY + date);
    if (!raw) return null;
    const { data, ts } = JSON.parse(raw);
    if (Date.now() - ts > CACHE_TTL) {
      localStorage.removeItem(CACHE_KEY + date);
      return null;
    }
    return data;
  } catch(e) { return null; }
}

function setCache(date, data) {
  try {
    localStorage.setItem(CACHE_KEY + date, JSON.stringify({ data, ts: Date.now() }));
    // Prune old entries — keep max 14 days
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(CACHE_KEY)) {
        try {
          const { ts } = JSON.parse(localStorage.getItem(k));
          if (Date.now() - ts > CACHE_TTL * 14) localStorage.removeItem(k);
        } catch(e) { localStorage.removeItem(k); }
      }
    }
  } catch(e) { /* storage full or unavailable */ }
}

/* ── Load ───────────────────────────────────────── */
async function loadData(forceRefresh) {
  if (isLoading) return;

  const btn = document.getElementById('refreshBtn');
  const icon = document.getElementById('rIcon');
  const err = document.getElementById('errorBanner');
  err.classList.remove('show');

  // Serve from cache instantly if available
  if (!forceRefresh) {
    const cached = getCached(selectedDate);
    if (cached) {
      render(cached);
      return;
    }
  }

  isLoading = true;
  btn.disabled = true;
  icon.className = 'spin';
  showSkeleton();

  try {
    const res = await fetch('/api/data?date=' + encodeURIComponent(selectedDate));

    if (!res.ok) {
      let msg = 'Server error ' + res.status;
      try { const e = await res.json(); msg = e.error || msg; } catch(e) {}
      throw new Error(msg);
    }

    const data = await res.json();
    setCache(selectedDate, data);
    render(data);
  } catch(e) {
    document.getElementById('errMsg').textContent = e.message;
    err.classList.add('show');
    document.getElementById('dash').innerHTML = '';
  } finally {
    isLoading = false;
    btn.disabled = false;
    icon.className = '';
  }
}

/* ── Helpers ──────────────────────────────────── */
function killCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
  charts = {};
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ── Chart config ────────────────────────────── */
const chartFont = { family: "'DM Mono', monospace", size: 11 };
const gridColor = '#eef0f4';
const tickColor = '#8C7080';
const tooltipBg = '#380717';
const tooltipBorder = '#5A2D3A';

function isMobile() { return window.innerWidth < 640; }

/* ── Render ──────────────────────────────────── */
function render(data) {
  killCharts();
  const y = data.yesterday;

  if (!y || y.total === 0) {
    document.getElementById('dash').innerHTML = `
      <div class="empty-state fade-in">
        <div class="empty-state-icon">&#x1F4ED;</div>
        <div class="empty-state-title">No ticket data for this date</div>
        <div class="empty-state-desc">
          Intercom returned no conversations for ${esc(data.date)}. This could mean it was a quiet day, or the date is outside your data retention window.
        </div>
      </div>
    `;
    return;
  }

  const trend = data.trend_7days || [];
  const displayDate = new Date(data.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const total = (y.ai_resolved || 0) + (y.human_resolved || 0);
  const pctAI = total > 0 ? Math.round(y.ai_resolved / total * 100) : 0;
  const totalRatings = Object.values(y.ratings || {}).reduce((a, b) => a + b, 0);
  const star1pct = totalRatings > 0 ? Math.round((y.ratings['1'] || 0) / totalRatings * 100) : 0;

  document.getElementById('dash').innerHTML = `
    <div class="slabel fade-in">${displayDate}</div>
    <div class="kpi-grid fade-in fade-d1" style="margin-bottom:8px;">
      <div class="kpi c-orange"><div class="kpi-lbl">Tickets raised</div><div class="kpi-val">${y.total}</div><div class="kpi-sub">all types</div></div>
      <div class="kpi c-burgundy"><div class="kpi-lbl">AI resolved</div><div class="kpi-val">${y.ai_resolved}</div><div class="kpi-sub">${pctAI}% of day</div></div>
      <div class="kpi c-green"><div class="kpi-lbl">Human resolved</div><div class="kpi-val">${y.human_resolved}</div><div class="kpi-sub">${100 - pctAI}% of day</div></div>
      <div class="kpi c-yellow"><div class="kpi-lbl">Avg close time</div><div class="kpi-val">${(y.avg_close_min || 0).toLocaleString()}</div><div class="kpi-sub">min / ticket</div></div>
    </div>

    <div class="slabel fade-in fade-d2">Breakdown</div>
    <div class="g3 fade-in fade-d3" style="margin-bottom:14px;">
      <div class="card">
        <div class="card-title">Why tickets were raised</div>
        <div class="card-sub">ticket type distribution</div>
        ${(y.ticket_types || []).length > 0 ? `
          <ul class="blist">
            ${(y.ticket_types || []).map((t, i) => {
              const max = Math.max(...(y.ticket_types || []).map(x => x.count), 1);
              const cols = ['#F24A00', '#380717', '#1A8A54', '#D93025', '#8C7080'];
              return '<li class="brow"><span class="blbl">' + esc(t.name) + '</span><div class="btrack"><div class="bfill" style="width:' + Math.round(t.count / max * 100) + '%;background:' + cols[i % cols.length] + ';"></div></div><span class="bval">' + t.count + '</span></li>';
            }).join('')}
          </ul>
        ` : '<div class="empty">No ticket type data</div>'}
      </div>

      <div class="card">
        <div class="card-title">Rating breakdown</div>
        <div class="card-sub">customer satisfaction scores</div>
        ${totalRatings > 0 ? `
          ${[5,4,3,2,1].map(s => {
            const c = y.ratings?.[s] || 0;
            const max = Math.max(...[1,2,3,4,5].map(x => y.ratings?.[x] || 0), 1);
            const cols = { 5: '#1A8A54', 4: '#4DA870', 3: '#F2A600', 2: '#E06830', 1: '#D93025' };
            return '<div class="srow"><span class="slbl2">' + s + '\u2605</span><div class="strack"><div class="sfill" style="width:' + Math.round(c / max * 100) + '%;background:' + cols[s] + ';"></div></div><span class="snum">' + c + '</span></div>';
          }).join('')}
          ${star1pct > 50 ? '<div class="insight">' + star1pct + '% of ratings were 1\u2605 &mdash; investigate root causes below</div>' : ''}
        ` : '<div class="empty">No ratings recorded</div>'}
      </div>

      <div class="card">
        <div class="card-title">AI vs Human</div>
        <div class="card-sub">resolution split</div>
        ${total > 0 ? `
          <div style="position:relative;width:100%;height:148px;"><canvas id="donutChart"></canvas></div>
          <div class="chart-legend" style="margin-top:14px;">
            <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#F24A00;"></span>AI ${pctAI}%</span>
            <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#380717;"></span>Human ${100 - pctAI}%</span>
          </div>
        ` : '<div class="empty">No resolutions recorded</div>'}
      </div>
    </div>

    ${(y.bad_reason_categories || []).length > 0 ? `
    <div class="slabel fade-in fade-d4">Reasons for bad ratings</div>
    <div class="g2 fade-in fade-d4" style="margin-bottom:14px;">
      <div class="card">
        <div class="card-title">Complaint categories</div>
        <div class="card-sub">1\u2605 &amp; 2\u2605 feedback &middot; ${esc(data.date)}</div>
        <ul class="blist">
          ${(y.bad_reason_categories || []).map((r, i) => {
            const max = Math.max(...(y.bad_reason_categories || []).map(x => x.count), 1);
            const cols = ['#D93025', '#E06830', '#F2A600', '#8C7080', '#F24A00', '#1A8A54', '#5A2D3A', '#380717'];
            return '<li class="brow"><span class="blbl">' + esc(r.name) + '</span><div class="btrack"><div class="bfill" style="width:' + Math.round(r.count / max * 100) + '%;background:' + cols[i % cols.length] + ';"></div></div><span class="bval">' + r.count + '</span></li>';
          }).join('')}
        </ul>
      </div>
      <div class="card">
        <div class="card-title">Customer feedback verbatim</div>
        <div class="card-sub">exact words from complaints</div>
        ${(y.user_quotes || []).length > 0
          ? (y.user_quotes || []).slice(0, 5).map(q =>
            '<div class="qrow"><div class="qtext">' + esc(q.text) + '</div><div class="qmeta">' + (q.rating ? q.rating + '\u2605 &middot; ' : '') + esc(q.sport || '') + (q.location ? ' &middot; ' + esc(q.location) : '') + '</div></div>'
          ).join('')
          : '<div class="empty">No written feedback today</div>'}
      </div>
    </div>` : ''}

    ${(y.sports_breakdown || []).length > 0 ? `
    <div class="slabel fade-in fade-d5">Bad ratings by sport</div>
    <div class="card fade-in fade-d5" style="margin-bottom:14px;">
      <div class="card-title">Which sport generated the most complaints</div>
      <div class="card-sub">bad rating tickets by equipment type &middot; ${esc(data.date)}</div>
      <div style="position:relative;width:100%;height:${isMobile() ? 200 : 180}px;"><canvas id="sportChart"></canvas></div>
    </div>` : ''}

    <div class="slabel fade-in fade-d6">7-day trend</div>
    <div class="card fade-in fade-d6" style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:8px;">
        <div>
          <div class="card-title">Tickets per day</div>
          <div class="card-sub" style="margin-bottom:0;">7 days ending ${displayDate}</div>
        </div>
        <div class="chart-legend">
          <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#F24A00;"></span>AI</span>
          <span class="chart-legend-item"><span class="chart-legend-dot" style="background:#380717;"></span>Human</span>
        </div>
      </div>
      ${trend.length > 0
        ? '<div style="position:relative;width:100%;height:' + (isMobile() ? 180 : 220) + 'px;"><canvas id="trendChart"></canvas></div>'
        : '<div class="empty">No trend data available</div>'}
    </div>
  `;

  /* ── Charts ─────────────────────────────────── */
  const donutEl = document.getElementById('donutChart');
  if (donutEl && total > 0) {
    charts.donut = new Chart(donutEl, {
      type: 'doughnut',
      data: {
        labels: ['AI', 'Human'],
        datasets: [{
          data: [y.ai_resolved || 0, y.human_resolved || 0],
          backgroundColor: ['#F24A00', '#380717'],
          borderWidth: 0,
          hoverOffset: 6,
          borderRadius: 3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '72%',
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: tooltipBg,
            borderColor: tooltipBorder,
            borderWidth: 1,
            titleFont: chartFont,
            bodyFont: chartFont,
            titleColor: '#FFD8C9',
            bodyColor: '#FFD8C9',
            padding: 10,
            cornerRadius: 8,
            boxPadding: 4,
            callbacks: {
              label: ctx => ' ' + ctx.parsed + ' tickets (' + Math.round(ctx.parsed / total * 100) + '%)'
            }
          }
        }
      }
    });
  }

  const sportEl = document.getElementById('sportChart');
  if (sportEl && (y.sports_breakdown || []).length > 0) {
    const cols = ['#F24A00', '#380717', '#1A8A54', '#D93025', '#8C7080', '#5A2D3A'];
    charts.sport = new Chart(sportEl, {
      type: 'bar',
      data: {
        labels: y.sports_breakdown.map(s => s.sport),
        datasets: [{
          data: y.sports_breakdown.map(s => s.count),
          backgroundColor: y.sports_breakdown.map((_, i) => cols[i % cols.length]),
          borderRadius: 5,
          maxBarThickness: 48
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: tooltipBg,
            borderColor: tooltipBorder,
            borderWidth: 1,
            titleFont: chartFont,
            bodyFont: chartFont,
            titleColor: '#FFD8C9',
            bodyColor: '#FFD8C9',
            padding: 10,
            cornerRadius: 8,
            callbacks: { label: ctx => ' ' + ctx.parsed.y + ' bad ratings' }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { color: tickColor, font: { ...chartFont, size: isMobile() ? 10 : 12 }, maxRotation: isMobile() ? 45 : 0 },
            border: { display: false }
          },
          y: {
            grid: { color: gridColor },
            ticks: { color: tickColor, font: chartFont, stepSize: 1, precision: 0 },
            beginAtZero: true,
            border: { display: false }
          }
        }
      }
    });
  }

  const trendEl = document.getElementById('trendChart');
  if (trendEl && trend.length > 0) {
    const mobile = isMobile();
    const trendLabels = trend.map(d => {
      if (mobile) {
        const dt = new Date(d.date + 'T12:00:00');
        return dt.toLocaleDateString('en-GB', { weekday: 'short' });
      }
      return d.label || d.date;
    });

    charts.trend = new Chart(trendEl, {
      type: 'bar',
      data: {
        labels: trendLabels,
        datasets: [
          {
            label: 'AI',
            data: trend.map(d => d.ai || 0),
            backgroundColor: '#F24A00',
            borderRadius: { topLeft: 0, topRight: 0, bottomLeft: 5, bottomRight: 5 },
            maxBarThickness: 40,
            stack: 'a'
          },
          {
            label: 'Human',
            data: trend.map(d => d.human || 0),
            backgroundColor: '#380717',
            borderRadius: { topLeft: 5, topRight: 5, bottomLeft: 0, bottomRight: 0 },
            maxBarThickness: 40,
            stack: 'a'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: tooltipBg,
            borderColor: tooltipBorder,
            borderWidth: 1,
            titleFont: { ...chartFont, weight: '600' },
            bodyFont: chartFont,
            titleColor: '#FFD8C9',
            bodyColor: '#FFD8C9',
            padding: 12,
            cornerRadius: 8,
            displayColors: true,
            boxPadding: 4,
            callbacks: {
              title: ctx => {
                const idx = ctx[0].dataIndex;
                return trend[idx].label || trend[idx].date;
              },
              afterBody: ctx => {
                const idx = ctx[0].dataIndex;
                const t = trend[idx];
                return 'Total: ' + (t.ai + t.human);
              }
            }
          }
        },
        scales: {
          x: {
            stacked: true,
            grid: { display: false },
            ticks: {
              color: tickColor,
              font: { ...chartFont, size: mobile ? 10 : 11 },
              maxRotation: mobile ? 45 : 0
            },
            border: { display: false }
          },
          y: {
            stacked: true,
            grid: { color: gridColor },
            ticks: {
              color: tickColor,
              font: chartFont,
              stepSize: Math.max(1, Math.ceil(Math.max(...trend.map(d => d.ai + d.human)) / 5)),
              precision: 0,
              padding: 8
            },
            beginAtZero: true,
            border: { display: false }
          }
        }
      }
    });
  }
}

/* ── Resize ──────────────────────────────────── */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    Object.values(charts).forEach(c => { try { c.resize(); } catch(e) {} });
  }, 150);
});

/* ── Init ────────────────────────────────────── */
window.addEventListener('load', loadData);
</script>
</body>
</html>
